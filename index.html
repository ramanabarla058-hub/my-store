<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f3f6;
}

/* HEADER */
header{
  background:#131921;
  color:white;
  padding:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h2{
  margin:0;
  color:#ff9900;
}

header input{
  width:50%;
  padding:8px;
  border-radius:5px;
  border:none;
}

/* CATEGORY BAR */
.categories{
  display:flex;
  overflow-x:auto;
  background:white;
  padding:10px;
}

.cat{
  min-width:100px;
  background:#2874f0;
  color:white;
  margin-right:10px;
  padding:8px;
  text-align:center;
  border-radius:20px;
  font-size:12px;
}

/* BANNER */
.banner{
  margin:10px;
  background:linear-gradient(90deg,#2874f0,#00c6ff);
  color:white;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:10px;
  padding:10px;
  transition:0.3s;
}

.card img{
  width:100%;
  border-radius:10px;
}

.card:hover{
  transform:scale(1.03);
}

.price{
  color:green;
  font-weight:bold;
}

button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}

.add{
  background:#2874f0;
  color:white;
}

.wish{
  background:#ff4081;
  color:white;
}

/* CART BUTTON */
.topbtn{
  background:#ff9900;
  border:none;
  padding:8px;
  border-radius:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  <h2>MyStore</h2>

  <input id="searchBox" onkeyup="search()" placeholder="Search products...">

  <button class="topbtn" onclick="viewCart()">🛒</button>
</header>

<!-- CATEGORY -->
<div class="categories">
  <div class="cat">Mobiles</div>
  <div class="cat">Fashion</div>
  <div class="cat">Electronics</div>
  <div class="cat">Home</div>
  <div class="cat">Beauty</div>
</div>

<!-- BANNER -->
<div class="banner">
  🔥 Big Sale Today - Up to 70% OFF 🔥
</div>

<!-- PRODUCTS -->
<div class="products" id="list"></div>

<script>

let cart = [];

let products = [
  {name:"iPhone", price:69999, img:"https://picsum.photos/200?1"},
  {name:"Shoes", price:1999, img:"https://picsum.photos/200?2"},
  {name:"Headphones", price:999, img:"https://picsum.photos/200?3"},
  {name:"Watch", price:2999, img:"https://picsum.photos/200?4"}
];

function show(){
  let html = "";

  products.forEach((p,i)=>{
    html += `
    <div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">₹${p.price}</p>

      <button class="add" onclick="add(${i})">Add to Cart</button>
      <button class="wish" onclick="wish('${p.name}')">❤️ Wishlist</button>
    </div>`;
  });

  document.getElementById("list").innerHTML = html;
}

function add(i){
  cart.push(products[i]);
  alert("Added to cart 🛒");
}

function viewCart(){
  if(cart.length==0){
    alert("Cart empty");
    return;
  }

  let total = 0;
  let msg = "🛒 CART\n\n";

  cart.forEach((p)=>{
    msg += p.name+" - ₹"+p.price+"\n";
    total += p.price;
  });

  msg += "\nTOTAL: ₹"+total;
  alert(msg);
}

function wish(name){
  alert(name + " added to wishlist ❤️");
}

function search(){
  let val = document.getElementById("searchBox").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for(let c of cards){
    let name = c.getElementsByTagName("h4")[0].innerText.toLowerCase();
    c.style.display = name.includes(val) ? "block" : "none";
  }
}

show();

</script>

</body>
</html>>
