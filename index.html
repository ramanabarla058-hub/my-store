<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreenKart Pro</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f3fff6;
}

/* HEADER */
header{
  background:#1dbf73;
  color:white;
  padding:12px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  position:sticky;
  top:0;
}

/* SEARCH */
.search{
  padding:10px;
  text-align:center;
  background:white;
}

.search input{
  width:90%;
  padding:10px;
  border:2px solid #1dbf73;
  border-radius:25px;
}

/* PRODUCTS */
.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
}

.card h3{
  margin:5px;
}

.price{
  color:#1dbf73;
  font-weight:bold;
  margin:5px;
}

.card button{
  width:100%;
  padding:8px;
  border:none;
  background:#1dbf73;
  color:white;
  font-size:14px;
}

/* CART */
.cart{
  position:fixed;
  right:10px;
  bottom:10px;
  background:#1dbf73;
  color:white;
  padding:10px 15px;
  border-radius:50px;
}
</style>
</head>

<body>

<header>
🛍️ GreenKart Ultra Pro
</header>

<div class="search">
<input type="text" onkeyup="search(this.value)" placeholder="Search products...">
</div>

<div class="container" id="products"></div>

<div class="cart">
🛒 <span id="count">0</span>
</div>

<script>

let products = [
  {name:"Smart Watch", price:999, img:"https://picsum.photos/200?1"},
  {name:"Headphones", price:1299, img:"https://picsum.photos/200?2"},
  {name:"Shoes", price:1999, img:"https://picsum.photos/200?3"},
  {name:"Backpack", price:799, img:"https://picsum.photos/200?4"},
  {name:"Phone Case", price:299, img:"https://picsum.photos/200?5"},
  {name:"T-shirt", price:499, img:"https://picsum.photos/200?6"}
];

let cartCount = 0;

function show(data){
  let box = document.getElementById("products");
  box.innerHTML = "";

  data.forEach(p=>{
    box.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">₹${p.price}</p>
        <button onclick="add()">Add to Cart</button>
      </div>
    `;
  });
}

function add(){
  cartCount++;
  document.getElementById("count").innerText = cartCount;
}

function search(val){
  let filtered = products.filter(p =>
    p.name.toLowerCase().includes(val.toLowerCase())
  );
  show(filtered);
}

show(products);

</script>

</body>
</html>
