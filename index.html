<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Store</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f3f6;
}

/* HEADER */
header{
  background:#2874f0;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header input{
  width:45%;
  padding:8px;
  border:none;
  border-radius:5px;
}

/* BUTTONS */
.btn{
  background:white;
  color:#2874f0;
  border:none;
  padding:6px;
  border-radius:5px;
}

/* PRODUCTS */
.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.card{
  background:white;
  padding:10px;
  border-radius:10px;
}

.card img{
  width:100%;
  border-radius:10px;
}

.price{
  color:green;
  font-weight:bold;
}

button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border:none;
  background:#2874f0;
  color:white;
  border-radius:5px;
}

/* ADMIN PANEL */
#adminPanel{
  display:none;
  padding:10px;
  background:white;
}
</style>
</head>

<body>

<header>
  <h3>My Store</h3>

  <input id="searchBox" onkeyup="searchProduct()" placeholder="Search...">

  <button class="btn" onclick="viewCart()">🛒</button>
  <button class="btn" onclick="viewWishlist()">❤️</button>
  <button class="btn" onclick="toggleAdmin()">Admin</button>
</header>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <h3>Add Product</h3>
  <input id="pname" placeholder="Name"><br>
  <input id="pprice" placeholder="Price"><br>
  <input id="pimg" placeholder="Image URL"><br>
  <button onclick="addProduct()">Add</button>
</div>

<!-- PRODUCTS -->
<div class="products" id="productList"></div>

<script>

let cart = [];
let wishlist = [];

/* DEFAULT PRODUCTS */
let products = [
  {name:"Smart Watch", price:999, img:"https://picsum.photos/200?1"},
  {name:"Headphones", price:1299, img:"https://picsum.photos/200?2"},
  {name:"Mobile Phone", price:9999, img:"https://picsum.photos/200?3"}
];

/* SHOW PRODUCTS */
function showProducts(){
  let html = "";

  products.forEach((p,i)=>{
    html += `
    <div class="card">
      <img src="${p.img}">
      <h4>${p.name}</h4>
      <p class="price">₹${p.price}</p>

      <button onclick="addCart(${i})">Add to Cart</button>
      <button onclick="addWish(${i})">❤️ Wishlist</button>
    </div>`;
  });

  document.getElementById("productList").innerHTML = html;
}

/* CART */
function addCart(i){
  cart.push(products[i]);
  alert("Added to cart 🛒");
}

function viewCart(){
  if(cart.length==0){
    alert("Cart empty");
    return;
  }

  let total = 0;
  let msg = "🛒 CART\n\n";

  cart.forEach((p,i)=>{
    msg += (i+1)+". "+p.name+" - ₹"+p.price+"\n";
    total += p.price;
  });

  msg += "\nTOTAL: ₹"+total;
  alert(msg);
}

/* WISHLIST */
function addWish(i){
  wishlist.push(products[i].name);
  alert("Added ❤️");
}

function viewWishlist(){
  alert("❤️ Wishlist:\n\n"+wishlist.join("\n"));
}

/* SEARCH */
function searchProduct(){
  let val = document.getElementById("searchBox").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for(let c of cards){
    let name = c.getElementsByTagName("h4")[0].innerText.toLowerCase();
    c.style.display = name.includes(val) ? "block" : "none";
  }
}

/* ADMIN */
function toggleAdmin(){
  let a = document.getElementById("adminPanel");
  a.style.display = (a.style.display=="block") ? "none" : "block";
}

function addProduct(){
  let name = document.getElementById("pname").value;
  let price = document.getElementById("pprice").value;
  let img = document.getElementById("pimg").value;

  products.push({name,price,img});
  showProducts();

  alert("Product added");
}

showProducts();

</script>

</body>
</html>
